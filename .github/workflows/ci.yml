name: NeuroX CI

on:
  pull_request:
  push:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16.9-bookworm
        env:
          POSTGRES_DB: neurox
          POSTGRES_USER: neurox_migration
          POSTGRES_PASSWORD: ci-migration-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U neurox_migration -d neurox"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+asyncpg://neurox_migration:ci-migration-password@localhost:5432/neurox
      WORKER_DATABASE_URL: postgresql+asyncpg://neurox_migration:ci-migration-password@localhost:5432/neurox
      AUTH_MODE: development
      APP_ENV: test
      DATA_ENCRYPTION_SECRET: ci-only-encryption-key-at-least-32-characters
      BLIND_INDEX_SECRET: ci-only-blind-index-key-at-least-32-chars
      NEUROX_APP_DB_PASSWORD: ci-app-password
      NEUROX_WORKER_DB_PASSWORD: ci-worker-password
      NEUROX_RELAY_DB_PASSWORD: ci-relay-password
      NEUROX_AUDIT_DB_PASSWORD: ci-audit-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/api/requirements.txt
      - run: pip install -r services/api/requirements-dev.txt
      - name: Bootstrap least-privilege database roles
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGPASSWORD: ci-migration-password
          POSTGRES_DB: neurox
          POSTGRES_USER: neurox_migration
        run: bash infra/postgres/001-roles.sh
      - run: ruff check services/api services/mock_erp
      - name: API type check
        working-directory: services/api
        run: mypy --ignore-missing-imports app/domain
      - name: API tests
        working-directory: services/api
        run: pytest -q
      - name: Migration upgrade, downgrade, re-upgrade
        working-directory: services/api
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
      - name: Live PostgreSQL checkpoint and RLS tests
        working-directory: services/api
        env:
          NEUROX_LIVE_POSTGRES_URL: postgresql://neurox_worker:ci-worker-password@localhost:5432/neurox
          NEUROX_LIVE_MIGRATION_URL: postgresql://neurox_migration:ci-migration-password@localhost:5432/neurox
          NEUROX_LIVE_APP_URL: postgresql://neurox_app:ci-app-password@localhost:5432/neurox
          NEUROX_LIVE_WORKER_URL: postgresql://neurox_worker:ci-worker-password@localhost:5432/neurox
          NEUROX_LIVE_RELAY_URL: postgresql://neurox_relay:ci-relay-password@localhost:5432/neurox
          NEUROX_LIVE_AUDIT_URL: postgresql://neurox_audit:ci-audit-password@localhost:5432/neurox
        run: pytest -q tests/integration
      - name: OpenAPI contract drift
        working-directory: services/api
        run: |
          python -m scripts.export_openapi
          git diff --exit-code -- ../../packages/contracts/openapi.json
      - name: Evaluation manifest smoke
        working-directory: services/api
        run: pytest -q tests/test_evaluation_manifest.py
      - run: pip-audit -r services/api/requirements.txt
      - run: pip-audit -r services/api/requirements-document.txt
      - run: pip-audit -r services/api/requirements-retrieval.txt
      - run: python -m compileall -q services/api services/mock_erp
      - run: |
          python -m json.tool packages/contracts/events/envelope.schema.json >/dev/null
          python -m json.tool packages/contracts/events/payloads.schema.json >/dev/null

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.22.0"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - name: Generated API client drift
        run: |
          npm run api:generate
          git diff --exit-code -- src/generated
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high

  compose-contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose config --quiet
      - name: Compile OPA policies
        run: docker run --rm -v "$PWD/policies:/policies:ro" openpolicyagent/opa:1.5.1-static check /policies

  container-images:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            dockerfile: services/api/Dockerfile
          - name: document-worker
            dockerfile: services/api/Dockerfile.document
          - name: retrieval
            dockerfile: services/api/Dockerfile.retrieval
          - name: mock-erp
            dockerfile: services/mock_erp/Dockerfile
          - name: web
            dockerfile: apps/web/Dockerfile
          - name: postgres
            dockerfile: infra/postgres/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - name: Build ${{ matrix.name }}
        run: docker build -f "${{ matrix.dockerfile }}" -t "neurox-${{ matrix.name }}:test" .
      - uses: anchore/sbom-action@v0.17.9
        with:
          image: neurox-${{ matrix.name }}:test
          artifact-name: neurox-${{ matrix.name }}.spdx.json
          format: spdx-json
      - uses: aquasecurity/trivy-action@0.32.0
        with:
          image-ref: neurox-${{ matrix.name }}:test
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
          ignore-unfixed: true

  secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
